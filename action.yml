name: Set up Swift
description: >-
  Install a Swift toolchain through Swiftly and put it first on PATH, on Linux and macOS runners.
  Reads the version from `.swift-version` when none is given. Never runs `swiftly use`, so the
  working tree stays clean and the requested version wins over the file.
author: the swift-wire project authors
branding:
  icon: download
  color: orange

inputs:
  swift-version:
    description: >-
      The toolchain to install, in any form `swiftly install` accepts: a release such as `6.4.0`, or a
      snapshot such as `6.4.x-snapshot-2026-09-04` or `main-snapshot`. When omitted, the first line of
      `.swift-version` in the working directory is used.
    required: false
    default: ""

outputs:
  swift-version:
    description: The toolchain that was installed, as Swiftly names it.
    value: ${{ steps.toolchain.outputs.swift-version }}
  toolchain-path:
    description: The installed toolchain's `bin` directory, which is now first on PATH.
    value: ${{ steps.toolchain.outputs.toolchain-path }}

runs:
  using: composite
  steps:
    - name: Install Swiftly (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -sSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf - -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
        echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

    - name: Install Swiftly (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        curl -sSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
        "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
        echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

    - name: Unsupported runner
      if: runner.os != 'Linux' && runner.os != 'macOS'
      shell: bash
      run: |
        echo "::error::Swiftly does not support ${{ runner.os }} runners."
        exit 1

    - name: Install the toolchain
      id: toolchain
      shell: bash
      env:
        REQUESTED: ${{ inputs.swift-version }}
      run: |
        version="$REQUESTED"
        if [ -z "$version" ]; then
          if [ ! -f .swift-version ]; then
            echo "::error::No swift-version input and no .swift-version file in $(pwd)."
            exit 1
          fi
          version="$(head -n 1 .swift-version | tr -d '[:space:]')"
        fi

        # `--post-install-file` collects the system packages the toolchain needs (on Linux, the libraries
        # Foundation links) into a script instead of failing the install when they are missing; run it
        # with root so the toolchain is complete before anything builds. The script installs with
        # `apt-get install` alone, trusting the image's package lists; those go stale as soon as the
        # archive supersedes a version they name, and the install then 404s. Refresh them first.
        post_install="$RUNNER_TEMP/swiftly-post-install.sh"
        rm -f "$post_install"
        swiftly install "$version" --assume-yes --post-install-file "$post_install"
        if [ -f "$post_install" ]; then
          as_root=()
          if [ "$(id -u)" -ne 0 ]; then
            as_root=(sudo)
          fi
          if command -v apt-get >/dev/null; then
            "${as_root[@]}" env DEBIAN_FRONTEND=noninteractive apt-get update -q
          fi
          "${as_root[@]}" env DEBIAN_FRONTEND=noninteractive bash "$post_install"
        fi

        # The toolchain's own `bin` goes first on PATH, not Swiftly's shims: the shims prefer whatever
        # `.swift-version` names in the working directory, and the version this action was asked for
        # must win even when the two differ. `swiftly use` is never called either — it rewrites
        # `.swift-version` and would dirty the tree for any job that then runs `git diff --exit-code`.
        bin="$(swiftly run "+$version" sh -c 'dirname "$(command -v swift)"')"
        echo "$bin" >> "$GITHUB_PATH"
        echo "swift-version=$version" >> "$GITHUB_OUTPUT"
        echo "toolchain-path=$bin" >> "$GITHUB_OUTPUT"
        "$bin/swift" --version
